name: Build mod from zip
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack zip
        run: |
          mkdir unpacked
          unzip -q "$(ls *.zip | head -1)" -d unpacked
          COMMON=$(find unpacked -maxdepth 3 -type d -name common | head -1)
          cp -r "$(dirname "$COMMON")" tropica_src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1
      - name: Build
        working-directory: tropica_src/v26_2
        run: |
          set +e
          gradle build --no-daemon --console=plain > build.log 2>&1
          code=$?
          echo "===== ОШИБКИ ====="
          grep -n -E "error:|What went wrong|Caused by|Could not|Execution failed" -A4 build.log | head -80
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: tropica-26.2
          path: |
            tropica_src/v26_2/build/libs/*.jar
            !tropica_src/v26_2/build/libs/*-sources.jar
